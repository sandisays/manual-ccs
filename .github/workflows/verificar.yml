name: Verificar publicação

# Roda a cada envio e em cada pull request. Se a página perder as proteções
# (fonte externa, CSP, cabeçalho visível sem senha, arquivo sem criptografia),
# o envio fica marcado com X vermelho no GitHub. Não precisa da senha.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Conferir proteções do manual
        run: python3 tools/verificar.py
